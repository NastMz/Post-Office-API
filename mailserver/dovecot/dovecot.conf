# Dovecot 2.3 configuration for the Post Office lab.
protocols = imap lmtp
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout
mail_privileged_group = vmail

# Lab network only: no TLS, cleartext auth allowed inside the Docker network.
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

# --- Storage -----------------------------------------------------------------
mail_location = maildir:/var/mail/vhosts/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}

# --- Authentication ------------------------------------------------------------
# Master user: lets the API open a mailbox as "<user>*api" without keeping
# the user's password after login (see README, "Flujo de protocolos").
auth_master_user_separator = *
passdb {
  driver = passwd-file
  master = yes
  args = /etc/dovecot/master-users
  pass = yes
}
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# --- Services ------------------------------------------------------------------
service imap-login {
  inet_listener imap {
    port = 143
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}

protocol lmtp {
  postmaster_address = postmaster@${MAIL_DOMAIN}
}

protocol imap {
  mail_max_userip_connections = 50
}
